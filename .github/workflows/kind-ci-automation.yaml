name: KinD E2E

on:
  pull_request:
    branches:
      - "master"
      - "v*"
  push:
    branches:
      - "master"
      - "v*"

permissions:
  contents: read

jobs:
  ci-e2e-sequential:
    uses: ./.github/workflows/kind-e2e-job.yaml
    with:
      test-type: sequential

  ci-e2e-parallel:
    uses: ./.github/workflows/kind-e2e-job.yaml
    with:
      test-type: parallel
