name: Verify generated code is up to date
on:
  push:
    branches:
    - '*'
  pull_request:
    branches:
      - '*'

jobs:
  check-go-modules:
    name: "Check for go.mod/go.sum synchronicity"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Download all Go modules
        run: |
          go mod download
      - name: Check for tidyness of go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code -- .
      - name: Check for tidyness of argocd-operator go.mod and go.sum
        working-directory: argocd-operator
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  check-sdk-codegen:
    name: "Check for changes from make bundle"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Run make bundle
        run: |
          make bundle

      # We ignore '*createdAt:*' because various generated YAMLs have a 'createdAt' field that is always updated with the current time.

      - name: Ensure there is no diff in bundle
        run: |
          git diff --ignore-matching-lines='.*createdAt:.*' --exit-code -- .

      - name: Run make generate
        run: |
          make generate
      - name: Ensure there is no diff in generated assets
        run: |
          git diff --ignore-matching-lines='.*createdAt:.*' --exit-code -- .
      - name: Run make manifests
        run: |
          make manifests
      - name: Ensure there is no diff in manifests
        run: |
          git diff --ignore-matching-lines='.*createdAt:.*' --exit-code -- .

  gosec:
    name: Ensure that code passes gosec and golint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: "Ensure code passes 'go-sec' - run 'make gosec' to identify issues"
        run: |
          make gosec

      - name: "Ensure code passes 'golangci-lint' - run 'make lint' to identify issues"
        run: |
          make lint 

  verify_argo_cd_has_updated_dependencies:
    name: Verify Argo CD has updated dependencies, for the given target version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: "Call update dependencies Makefile target"
        run: |
          make update-dependencies
      - name: Ensure there is no unexpected diff in repository artifacts
        run: |
          git diff --ignore-matching-lines='.*createdAt:.*' --exit-code -- .
