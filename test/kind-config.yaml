kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints: []
    extraMounts:
      - hostPath: /tmp/docker-config.json
        containerPath: /var/lib/kubelet/config.json
  - role: worker
    extraMounts:
      - hostPath: /tmp/docker-config.json
        containerPath: /var/lib/kubelet/config.json
  - role: worker
    extraMounts:
      - hostPath: /tmp/docker-config.json
        containerPath: /var/lib/kubelet/config.json
